<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users – Campus Hardware Lending System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="manage-users" data-title="Manage Users">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1><i class="fa-solid fa-users" aria-hidden="true"></i> Manage Users</h1>
          <p>Review flagged accounts, suspend misuse and manage admin access.</p>
        </div>
        <div class="page-actions"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="searchInput" class="form-control" placeholder="Search name, email or ID…" aria-label="Search users" />
        </div>
        <select id="roleFilter" class="form-control" aria-label="Role"><option value="">All roles</option><option value="student">Students</option><option value="admin">Admins</option></select>
        <select id="statusFilter" class="form-control" aria-label="Status"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="deactivated">Deactivated</option></select>
        <label class="switch"><input type="checkbox" id="flaggedOnly" /><span class="switch-track"></span> Flagged only</label>
        <span class="toolbar-count" id="resultCount"></span>
      </div>
      <div class="panel">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Trust</th><th>Rating</th><th>Active bookings</th><th>Joined</th><th>Actions</th></tr></thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/manage-users.js"></script>
</body>
</html>
