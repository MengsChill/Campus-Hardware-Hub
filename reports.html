<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="reports" data-title="Reports">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1><i class="fa-solid fa-chart-column" aria-hidden="true"></i> Reports</h1>
          <p><span id="reportDate"></span></p>
        </div>
        <div class="page-actions"><button type="button" class="btn-secondary" id="printBtn"><i class="fa-solid fa-print"></i> Print report</button></div>
      </div>

      <div id="reportBody" style="display:contents;">
      <section class="stats-grid" id="reportStats"></section>

      <section class="report-grid">
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-lock"></i> Escrow &amp; payments</h3><span class="badge badge-orange">Simulated gateway</span></div>
          <div id="financePanel"></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-chart-column"></i> Paid bookings per month</h3><span class="muted" style="font-size:12px;">Last 6 months</span></div>
          <div id="monthlyChart"></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-layer-group"></i> Bookings by category</h3></div>
          <div id="categoryChart"></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-trophy"></i> Most rented hardware</h3></div>
          <div id="topTools"></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-shield-heart"></i> Lowest Trust Points</h3><a href="manage-users.html?filter=flagged" class="card-link">Flagged accounts <i class="fa-solid fa-arrow-right"></i></a></div>
          <div id="lowestTrust"></div>
        </div>
      </section>

      <section class="dash-card">
        <div class="card-header"><h3><i class="fa-solid fa-triangle-exclamation" style="color:#DC2626;"></i> Overdue items</h3></div>
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Item</th><th>Borrower</th><th>Lender</th><th>Due date</th><th>Overdue by</th><th></th></tr></thead>
            <tbody id="overdueBody"></tbody>
          </table>
        </div>
      </section>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/reports.js"></script>
</body>
</html>
