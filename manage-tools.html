<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Listings – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="manage-tools" data-title="Manage Listings">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i> Manage Listings</h1>
          <p>Review every listing and remove ones that break the rules.</p>
        </div>
        <div class="page-actions"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="searchInput" class="form-control" placeholder="Search name, description or lender…" aria-label="Search listings" />
        </div>
        <select id="categoryFilter" class="form-control" aria-label="Category"><option value="">All categories</option></select>
        <select id="statusFilter" class="form-control" aria-label="Status">
          <option value="">All statuses</option><option value="available">Available</option><option value="maintenance">Under maintenance</option><option value="removed">Removed</option>
        </select>
        <span class="toolbar-count" id="resultCount"></span>
      </div>
      <div class="panel">
        <div class="table-wrapper">
          <table class="data-table">
            <thead><tr><th>Item</th><th>Lender</th><th>Status</th><th>Rate</th><th>Rating</th><th>Listed</th><th>Actions</th></tr></thead>
            <tbody id="toolsBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tools-ui.js"></script>
  <script src="js/pages/manage-tools.js"></script>
</body>
</html>
