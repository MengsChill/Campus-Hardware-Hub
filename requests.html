<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lending Requests – Campus Hardware Lending System</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="requests" data-title="Lending Requests">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1><i class="fa-solid fa-inbox" aria-hidden="true"></i> Lending Requests</h1>
          <p>Accept bookings, agree handover details, verify PINs and inspect returns.</p>
        </div>
        <div class="page-actions"></div>
      </div>

      <div class="tabs" id="requestTabs" role="tablist"></div>
      <div class="loan-list" id="requestList"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loans-ui.js"></script>
  <script src="js/pages/requests.js"></script>

</html>
