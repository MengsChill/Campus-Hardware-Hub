<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="dashboard" data-title="Dashboard">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div id="dashBody" style="display:contents;">
      <!-- Welcome Banner -->
      <div class="welcome-banner">
        <div class="welcome-text">
          <div class="welcome-kicker"><i class="fa-solid fa-building-columns"></i> CAMPUS HARDWARE LENDING SYSTEM</div>
          <h1>Welcome back, <span id="welcomeName">there</span></h1>
          <p id="welcomeMessage"></p>
          <div class="dashboard-meta"><i class="fa-regular fa-calendar"></i><span id="dashboardDate"></span></div>
        </div>
        <div class="welcome-actions" id="welcomeActions"></div>
      </div>

      <div id="dashNotice"></div>

      <!-- Stats Cards -->
      <section class="stats-grid" id="statsGrid"></section>

      <!-- Main Grid -->
      <section class="dash-grid">
        <div class="dash-card span-2">
          <div class="card-header">
            <h3 id="mainCardTitle"></h3>
            <a href="#" class="card-link" id="mainCardLink">View all <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div id="mainCardBody"><div class="loading-state"><span class="spinner"></span> Loading…</div></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3 id="sideCardTitle"></h3></div>
          <div id="sideCardBody"></div>
        </div>
      </section>

      <!-- Latest Tools -->
      <section class="dash-card">
        <div class="card-header">
          <h3 id="latestToolsTitle"></h3>
          <a href="catalog.html" class="card-link">See all <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="tool-grid" id="latestTools"></div>
      </section>

      <!-- Notifications + Activity -->
      <section class="dash-grid bottom-grid">
        <div class="dash-card">
          <div class="card-header">
            <h3><i class="fa-solid fa-bell"></i> Notifications</h3>
            <a href="notifications.html" class="card-link">View all <i class="fa-solid fa-arrow-right"></i></a>
          </div>
          <div class="notif-list" id="notifList"></div>
        </div>
        <div class="dash-card">
          <div class="card-header"><h3><i class="fa-solid fa-timeline"></i> Recent Activity</h3></div>
          <div class="activity-feed" id="activityFeed"></div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tools-ui.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
