<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Bookings – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="bookings" data-title="All Bookings">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1>All Bookings</h1>
          <p>Every booking in the system. Void a handover when the meetup did not take place.</p>
        </div>
        <div class="page-actions"></div>
      </div>

      <div class="toolbar">
        <div class="toolbar-search">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="search" id="searchInput" class="form-control" placeholder="Search item, borrower or lender…" aria-label="Search bookings" />
        </div>
        <select id="statusFilter" class="form-control" aria-label="Status">
          <option value="">All statuses</option><option value="open">In progress</option><option value="awaiting_payment">Awaiting payment</option>
          <option value="pending">Paid · awaiting response</option><option value="confirmed">Confirmed</option><option value="active">Handed over</option>
          <option value="overdue">Overdue</option><option value="return_pending">Pending inspection</option><option value="disputed">Disputed</option>
          <option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="declined">Declined</option><option value="voided">Voided</option>
        </select>
        <span class="toolbar-count" id="resultCount"></span>
      </div>
      <div class="loan-list" id="bookingList"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loans-ui.js"></script>
  <script src="js/pages/bookings.js"></script>
</body>
</html>
