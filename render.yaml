services:
  - type: web
    name: campus-hardware-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    disk:
      name: campus-hardware-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ADMIN_SECRET_CODE
        generateValue: true
      - key: NODE_OPTIONS
        value: --disable-warning=ExperimentalWarning
