services:
  - type: web
    name: campus-hardware-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_SECRET_CODE
        generateValue: true
      - key: NODE_OPTIONS
        value: --disable-warning=ExperimentalWarning
