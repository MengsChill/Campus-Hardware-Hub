<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History & Reviews – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="history" data-title="History & Reviews">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1>History & Reviews</h1>
          <p>Finished bookings. Rate the other person and the hardware after a booking is completed.</p>
        </div>
        <div class="page-actions"></div>
      </div>

      <div class="tabs" id="historyTabs" role="tablist">
        <button type="button" class="tab active" data-tab="borrowed"><i class="fa-solid fa-hand-holding"></i> Borrowed <span class="tab-count">0</span></button>
        <button type="button" class="tab" data-tab="lent"><i class="fa-solid fa-toolbox"></i> Lent out <span class="tab-count">0</span></button>
      </div>
      <div class="loan-list" id="historyList"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loans-ui.js"></script>
  <script src="js/pages/history.js"></script>
</body>
</html>
