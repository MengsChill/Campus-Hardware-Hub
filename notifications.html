<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications – Campus Hardware Lending System</title>
  <meta name="theme-color" content="#1565C0" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-page" data-page="notifications" data-title="Notifications">

  <!-- Sidebar and top bar are added by js/app.js -->
  <div class="main-content" id="mainContent">
    <main class="page-body">
      <div class="page-header">
        <div>
          <h1>Notifications</h1>
          <p>Updates about your bookings, payments, disputes and account.</p>
        </div>
        <div class="page-actions"><button type="button" class="btn-secondary" id="markAllBtn"><i class="fa-solid fa-check-double"></i> Mark all as read</button></div>
      </div>

      <div class="tabs" id="notifTabs" role="tablist">
        <button type="button" class="tab active" data-tab="all">All <span class="tab-count">0</span></button>
        <button type="button" class="tab" data-tab="unread">Unread <span class="tab-count">0</span></button>
      </div>
      <div class="panel notif-page-list" id="notifPageList"></div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
